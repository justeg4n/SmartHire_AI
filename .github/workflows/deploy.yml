name: Frontend CI/CD

on:
  push:
    branches:
      - fe
  pull_request:
    branches:
      - fe
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Create .env
        run: |
          echo "VITE_AWS_REGION=${{ secrets.VITE_AWS_REGION }}" >> .env
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env
          echo "VITE_AWS_USER_POOL_ID=${{ secrets.VITE_AWS_USER_POOL_ID }}" >> .env
          echo "VITE_AWS_USER_POOL_CLIENT_ID=${{ secrets.VITE_AWS_USER_POOL_CLIENT_ID }}" >> .env
          echo "VITE_AWS_IDENTITY_POOL_ID=${{ secrets.VITE_AWS_IDENTITY_POOL_ID }}" >> .env
          echo "VITE_COGNITO_DOMAIN=${{ secrets.VITE_COGNITO_DOMAIN }}" >> .env
          echo "VITE_AWS_S3_BUCKET=smarthire-raw-assets-dev" >> .env
          echo "VITE_APPSYNC_GRAPHQL_URL=${{ secrets.VITE_APPSYNC_GRAPHQL_URL }}" >> .env

      - name: Validate required AppSync env vars
        run: |
          test -n "$VITE_APPSYNC_GRAPHQL_URL" || { echo "Missing secret: VITE_APPSYNC_GRAPHQL_URL"; exit 1; }
          test -n "$VITE_AWS_REGION" || { echo "Missing secret: VITE_AWS_REGION"; exit 1; }
        env:
          VITE_APPSYNC_GRAPHQL_URL: ${{ secrets.VITE_APPSYNC_GRAPHQL_URL }}
          VITE_AWS_REGION: ${{ secrets.VITE_AWS_REGION }}

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Build Production
        run: npm run build

      - name: Configure AWS Credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Deploy to S3
        if: github.event_name == 'push'
        run: aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }} --delete

      - name: Invalidate CloudFront Cache
        if: github.event_name == 'push'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} \
            --paths "/*"
